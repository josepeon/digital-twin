<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jose Peon — Digital Twin</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-dim: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --user-bg: #1f6feb;
            --jose-bg: #21262d;
            --green: #3fb950;
            --red: #f85149;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 16px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #a371f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header .info h1 {
            font-size: 16px;
            font-weight: 600;
        }

        .header .info .subtitle {
            font-size: 12px;
            color: var(--text-dim);
        }

        .header .status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .header .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--red);
        }

        .header .status .dot.online { background: var(--green); }

        .header .settings-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 12px;
        }

        .header .settings-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        /* Settings panel */
        .settings-panel {
            display: none;
            padding: 12px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 13px;
        }

        .settings-panel.show { display: flex; }

        .settings-panel label {
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .settings-panel input[type="text"],
        .settings-panel input[type="password"] {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            width: 280px;
        }

        .settings-panel input[type="checkbox"] {
            accent-color: var(--accent);
        }

        /* Messages area */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 72%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
        }

        .message.user {
            background: var(--user-bg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.jose {
            background: var(--jose-bg);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message .meta {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .message .meta .lang-badge {
            background: var(--border);
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .message .meta .lang-badge.es { color: #f0883e; }
        .message .meta .lang-badge.en { color: var(--accent); }

        .message .voice-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 14px;
            padding: 0;
        }

        .message .voice-btn:hover { color: var(--accent); }

        /* Typing indicator */
        .typing {
            align-self: flex-start;
            padding: 12px 20px;
            background: var(--jose-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            display: none;
        }

        .typing.show { display: block; }

        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--text-dim);
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Input area */
        .input-area {
            padding: 16px 24px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .input-area textarea {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 42px;
            max-height: 120px;
            line-height: 1.4;
            outline: none;
        }

        .input-area textarea:focus {
            border-color: var(--accent);
        }

        .input-area textarea::placeholder {
            color: var(--text-dim);
        }

        .input-area button {
            background: var(--accent);
            border: none;
            color: var(--bg);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .input-area button:hover { background: var(--accent-hover); }
        .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Welcome */
        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .welcome .emoji { font-size: 48px; margin-bottom: 16px; }
        .welcome h2 { color: var(--text); font-size: 20px; margin-bottom: 8px; }
        .welcome p { max-width: 400px; margin: 0 auto; line-height: 1.6; font-size: 14px; }

        /* Scrollbar */
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* Mobile */
        @media (max-width: 600px) {
            .message { max-width: 88%; }
            .header { padding: 12px 16px; }
            .messages { padding: 16px; }
            .input-area { padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="avatar">🧬</div>
        <div class="info">
            <h1>Jose Peon</h1>
            <div class="subtitle">Digital Twin · AI Replica</div>
        </div>
        <div class="status">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
        <button class="settings-btn" onclick="toggleSettings()">⚙ Settings</button>
    </div>

    <!-- Settings -->
    <div class="settings-panel" id="settingsPanel">
        <label>
            API URL:
            <input type="text" id="apiUrl" value="https://digital-twin-production-c355.up.railway.app" />
        </label>
        <label>
            API Key:
            <input type="password" id="apiKey" placeholder="Enter API key" />
        </label>
        <label>
            <input type="checkbox" id="voiceToggle" /> Voice output
        </label>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
        <div class="welcome" id="welcome">
            <div class="emoji">🧬</div>
            <h2>Chat with Jose</h2>
            <p>Ask anything — in English or Spanish. The twin responds using Jose's real communication style, powered by RAG over 27K+ personal messages.</p>
        </div>
    </div>

    <!-- Typing indicator -->
    <div class="typing" id="typing">
        <span></span><span></span><span></span>
    </div>

    <!-- Input -->
    <div class="input-area">
        <textarea id="input" placeholder="Message Jose..." rows="1"
                  onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button id="sendBtn" onclick="sendMessage()">↑</button>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const typingEl = document.getElementById('typing');
        const welcomeEl = document.getElementById('welcome');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        let conversationHistory = [];

        // Auto-resize textarea
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('show');
        }

        function getConfig() {
            return {
                apiUrl: document.getElementById('apiUrl').value.replace(/\/+$/, ''),
                apiKey: document.getElementById('apiKey').value,
                voice: document.getElementById('voiceToggle').checked,
            };
        }

        // Check health on load
        async function checkHealth() {
            const config = getConfig();
            try {
                const resp = await fetch(`${config.apiUrl}/health`);
                const data = await resp.json();
                if (data.status === 'ok') {
                    statusDot.classList.add('online');
                    statusText.textContent = `Online · ${data.groq_model}`;
                } else {
                    statusText.textContent = 'Degraded';
                }
            } catch {
                statusText.textContent = 'Offline';
            }
        }

        function addMessage(role, text, meta = null) {
            if (welcomeEl) welcomeEl.style.display = 'none';

            const div = document.createElement('div');
            div.className = `message ${role}`;

            let html = text.replace(/\n/g, '<br>');

            if (meta && role === 'jose') {
                const langClass = meta.language === 'es' ? 'es' : 'en';
                html += `
                    <div class="meta">
                        <span class="lang-badge ${langClass}">${meta.language}</span>
                        <span>${meta.register}</span>
                        <span>${meta.examples_used} examples</span>
                        <span>${meta.elapsed}s</span>
                    </div>`;
            }

            div.innerHTML = html;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;

            // Play voice if enabled
            if (role === 'jose' && meta && meta.audio_url) {
                const audio = new Audio(meta.audio_url);
                audio.play().catch(() => {});
            }
        }

        async function sendMessage() {
            const query = inputEl.value.trim();
            if (!query) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;

            addMessage('user', query);
            conversationHistory.push({ role: 'user', content: query });

            // Build context-enriched query
            let enrichedQuery = query;
            if (conversationHistory.length > 2) {
                const context = conversationHistory.slice(-8).map(t =>
                    `${t.role === 'user' ? 'User' : 'Jose'}: ${t.content.slice(0, 200)}`
                ).join('\n');
                enrichedQuery = `[Previous conversation for context:\n${context}]\n\nUser's latest message: ${query}`;
            }

            // Show typing
            typingEl.classList.add('show');
            messagesEl.scrollTop = messagesEl.scrollHeight;

            const config = getConfig();
            const start = performance.now();

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (config.apiKey) {
                    headers['Authorization'] = `Bearer ${config.apiKey}`;
                }

                // If voice, use /ask-jose/voice to get audio
                let endpoint = '/ask-jose';
                let responseHandler;

                if (config.voice) {
                    // Get text response first
                    const textResp = await fetch(`${config.apiUrl}/ask-jose`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({ query: enrichedQuery }),
                    });

                    if (!textResp.ok) {
                        throw new Error(textResp.status === 401 ? 'Invalid API key' : `Error ${textResp.status}`);
                    }

                    const textData = await textResp.json();
                    const elapsed = ((performance.now() - start) / 1000).toFixed(1);

                    conversationHistory.push({ role: 'jose', content: textData.response });

                    // Get audio separately
                    const audioResp = await fetch(`${config.apiUrl}/ask-jose/voice`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({ query: enrichedQuery }),
                    });

                    let audioUrl = null;
                    if (audioResp.ok) {
                        const blob = await audioResp.blob();
                        audioUrl = URL.createObjectURL(blob);
                        const audio = new Audio(audioUrl);
                        audio.play().catch(() => {});
                    }

                    typingEl.classList.remove('show');
                    addMessage('jose', textData.response, {
                        language: textData.language,
                        register: textData.style_register,
                        examples_used: textData.examples_used,
                        elapsed,
                    });
                } else {
                    const resp = await fetch(`${config.apiUrl}/ask-jose`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({ query: enrichedQuery }),
                    });

                    if (!resp.ok) {
                        throw new Error(resp.status === 401 ? 'Invalid API key — set it in Settings ⚙' : `Error ${resp.status}`);
                    }

                    const data = await resp.json();
                    const elapsed = ((performance.now() - start) / 1000).toFixed(1);

                    conversationHistory.push({ role: 'jose', content: data.response });

                    typingEl.classList.remove('show');
                    addMessage('jose', data.response, {
                        language: data.language,
                        register: data.style_register,
                        examples_used: data.examples_used,
                        elapsed,
                    });
                }
            } catch (err) {
                typingEl.classList.remove('show');
                addMessage('jose', `Error: ${err.message}`);
            }

            sendBtn.disabled = false;
            inputEl.focus();
        }

        // Init
        checkHealth();
        inputEl.focus();

        // Load API key from localStorage
        const savedKey = localStorage.getItem('twin_api_key');
        if (savedKey) document.getElementById('apiKey').value = savedKey;
        document.getElementById('apiKey').addEventListener('change', (e) => {
            localStorage.setItem('twin_api_key', e.target.value);
        });
    </script>
</body>
</html>
