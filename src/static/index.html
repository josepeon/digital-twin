<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jose Peon — Digital Twin</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-dim: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --user-bg: #1f6feb;
            --jose-bg: #21262d;
            --green: #3fb950;
            --red: #f85149;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 16px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #a371f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header .info h1 {
            font-size: 16px;
            font-weight: 600;
        }

        .header .info .subtitle {
            font-size: 12px;
            color: var(--text-dim);
        }

        .header .status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .header .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--red);
        }

        .header .status .dot.online { background: var(--green); }
        .header .status .dot.ws { background: #a371f7; }

        .header .settings-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 12px;
        }

        .header .settings-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        /* Settings panel */
        .settings-panel {
            display: none;
            padding: 12px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
            font-size: 13px;
        }

        .settings-panel.show { display: flex; }

        .settings-panel label {
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .settings-panel input[type="text"],
        .settings-panel input[type="password"] {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            width: 280px;
        }

        .settings-panel input[type="checkbox"] {
            accent-color: var(--accent);
        }

        /* Messages area */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 72%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
        }

        .message.user {
            background: var(--user-bg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.jose {
            background: var(--jose-bg);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message .meta {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .message .meta .lang-badge {
            background: var(--border);
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .message .meta .lang-badge.es { color: #f0883e; }
        .message .meta .lang-badge.en { color: var(--accent); }

        /* Typing indicator */
        .typing {
            align-self: flex-start;
            padding: 12px 20px;
            background: var(--jose-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            display: none;
        }

        .typing.show { display: block; }

        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--text-dim);
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Input area */
        .input-area {
            padding: 16px 24px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .input-area textarea {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 42px;
            max-height: 120px;
            line-height: 1.4;
            outline: none;
        }

        .input-area textarea:focus {
            border-color: var(--accent);
        }

        .input-area textarea::placeholder {
            color: var(--text-dim);
        }

        .input-area button {
            background: var(--accent);
            border: none;
            color: var(--bg);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .input-area button:hover { background: var(--accent-hover); }
        .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

        .input-area .mic-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 18px;
        }

        .input-area .mic-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .input-area .mic-btn.recording {
            border-color: var(--red);
            color: var(--red);
            animation: pulse-mic 1s infinite;
        }

        @keyframes pulse-mic {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Welcome */
        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .welcome .emoji { font-size: 48px; margin-bottom: 16px; }
        .welcome h2 { color: var(--text); font-size: 20px; margin-bottom: 8px; }
        .welcome p { max-width: 400px; margin: 0 auto; line-height: 1.6; font-size: 14px; }

        /* Connection badge */
        .conn-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .conn-badge.ws { background: rgba(163,113,247,0.2); color: #a371f7; }
        .conn-badge.rest { background: rgba(88,166,255,0.2); color: var(--accent); }

        /* Scrollbar */
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* Mobile */
        @media (max-width: 600px) {
            .message { max-width: 88%; }
            .header { padding: 12px 16px; }
            .messages { padding: 16px; }
            .input-area { padding: 12px 16px; }
            .settings-panel input[type="text"],
            .settings-panel input[type="password"] { width: 180px; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="avatar">JP</div>
        <div class="info">
            <h1>Jose Peon</h1>
            <div class="subtitle">Digital Twin</div>
        </div>
        <div class="status">
            <div class="dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
        <button class="settings-btn" onclick="toggleSettings()">Settings</button>
    </div>

    <!-- Settings -->
    <div class="settings-panel" id="settingsPanel">
        <label>
            API URL:
            <input type="text" id="apiUrl" value="https://digital-twin-production-c355.up.railway.app" />
        </label>
        <label>
            API Key:
            <input type="password" id="apiKey" placeholder="Enter API key" />
        </label>
        <label>
            <input type="checkbox" id="voiceToggle" /> Voice output
        </label>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
        <div class="welcome" id="welcome">
            <div class="emoji">JP</div>
            <h2>Talk to Jose</h2>
            <p>Ask anything — in English or Spanish. Type or hold the mic to speak. Powered by RAG over 27K+ real messages.</p>
        </div>
    </div>

    <!-- Typing indicator -->
    <div class="typing" id="typing">
        <span></span><span></span><span></span>
    </div>

    <!-- Input -->
    <div class="input-area">
        <button class="mic-btn" id="micBtn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()" title="Hold to speak">🎤</button>
        <textarea id="input" placeholder="Message Jose..." rows="1"
                  onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button id="sendBtn" onclick="sendMessage()">↑</button>
    </div>

    <script>
        // ── DOM refs ──────────────────────────────────────────────────────
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const typingEl = document.getElementById('typing');
        const welcomeEl = document.getElementById('welcome');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const micBtn = document.getElementById('micBtn');

        // ── State ─────────────────────────────────────────────────────────
        let sessionId = crypto.randomUUID();
        let ws = null;
        let wsReady = false;
        let wsQueue = [];  // queued messages while connecting
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // ── Config ────────────────────────────────────────────────────────
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('show');
        }

        function getConfig() {
            return {
                apiUrl: document.getElementById('apiUrl').value.replace(/\/+$/, ''),
                apiKey: document.getElementById('apiKey').value,
                voice: document.getElementById('voiceToggle').checked,
            };
        }

        // ── WebSocket Connection ──────────────────────────────────────────
        function getWsUrl() {
            const config = getConfig();
            const httpUrl = config.apiUrl;
            return httpUrl.replace(/^http/, 'ws') + '/ws';
        }

        function connectWebSocket() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                return;
            }

            const url = getWsUrl();
            ws = new WebSocket(url);
            wsReady = false;

            ws.onopen = () => {
                console.log('WebSocket connected');
                // Send auth if key is set
                const config = getConfig();
                if (config.apiKey) {
                    ws.send(JSON.stringify({ type: 'auth', key: config.apiKey }));
                }
                wsReady = true;
                statusDot.className = 'dot ws';
                statusText.textContent = 'Connected (WS)';

                // Flush queued messages
                while (wsQueue.length > 0) {
                    const msg = wsQueue.shift();
                    ws.send(JSON.stringify(msg));
                }
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                handleWsMessage(msg);
            };

            ws.onclose = () => {
                console.log('WebSocket closed');
                wsReady = false;
                statusDot.className = 'dot';
                statusText.textContent = 'Disconnected';
                // Reconnect after 3s
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
                wsReady = false;
            };
        }

        let pendingStart = null;  // performance.now() when query sent

        function handleWsMessage(msg) {
            if (msg.type === 'error') {
                typingEl.classList.remove('show');
                addMessage('jose', `Error: ${msg.content}`);
                sendBtn.disabled = false;
                return;
            }

            if (msg.type === 'text' && msg.done) {
                typingEl.classList.remove('show');
                const elapsed = pendingStart ? ((performance.now() - pendingStart) / 1000).toFixed(1) : '?';
                pendingStart = null;
                addMessage('jose', msg.content, {
                    language: msg.language,
                    register: msg.register || '—',
                    examples_used: msg.examples_used || '—',
                    elapsed,
                });
                sendBtn.disabled = false;
                return;
            }

            if (msg.type === 'audio') {
                // Decode base64 audio and play
                const audioData = Uint8Array.from(atob(msg.content), c => c.charCodeAt(0));
                const blob = new Blob([audioData], { type: 'audio/mpeg' });
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                audio.play().catch(() => {});
                return;
            }
        }

        // ── Send Message (WebSocket primary, REST fallback) ──────────────
        async function sendMessage() {
            const query = inputEl.value.trim();
            if (!query) return;

            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;

            if (welcomeEl) welcomeEl.style.display = 'none';
            addMessage('user', query);

            typingEl.classList.add('show');
            messagesEl.scrollTop = messagesEl.scrollHeight;

            const config = getConfig();
            pendingStart = performance.now();

            // Try WebSocket first
            if (ws && ws.readyState === WebSocket.OPEN) {
                const msg = {
                    query,
                    session_id: sessionId,
                    voice: config.voice,
                };
                ws.send(JSON.stringify(msg));
                return;  // Response handled in handleWsMessage
            }

            // Fallback to REST
            try {
                const headers = { 'Content-Type': 'application/json' };
                if (config.apiKey) {
                    headers['Authorization'] = `Bearer ${config.apiKey}`;
                }
                const body = { query, session_id: sessionId };

                const resp = await fetch(`${config.apiUrl}/ask-jose`, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(body),
                });

                if (!resp.ok) {
                    throw new Error(resp.status === 401 ? 'Invalid API key — set it in Settings' : `Error ${resp.status}`);
                }

                const data = await resp.json();
                const elapsed = ((performance.now() - pendingStart) / 1000).toFixed(1);
                pendingStart = null;

                typingEl.classList.remove('show');
                addMessage('jose', data.response, {
                    language: data.language,
                    register: data.style_register,
                    examples_used: data.examples_used,
                    elapsed,
                });

                // Voice via REST
                if (config.voice) {
                    const audioResp = await fetch(`${config.apiUrl}/ask-jose/voice`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify(body),
                    });
                    if (audioResp.ok) {
                        const blob = await audioResp.blob();
                        const audio = new Audio(URL.createObjectURL(blob));
                        audio.play().catch(() => {});
                    }
                }
            } catch (err) {
                typingEl.classList.remove('show');
                addMessage('jose', `Error: ${err.message}`);
            }

            sendBtn.disabled = false;
            inputEl.focus();
        }

        // ── Voice Input (STT) ─────────────────────────────────────────────
        async function startRecording() {
            if (isRecording) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    if (audioChunks.length === 0) return;

                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    micBtn.classList.remove('recording');
                    isRecording = false;

                    // Transcribe
                    await transcribeAudio(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
            } catch (err) {
                console.error('Mic error:', err);
                alert('Microphone access denied');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
            }
        }

        async function transcribeAudio(blob) {
            const config = getConfig();
            const headers = {};
            if (config.apiKey) {
                headers['Authorization'] = `Bearer ${config.apiKey}`;
            }

            const formData = new FormData();
            formData.append('audio', blob, 'recording.webm');

            try {
                const resp = await fetch(`${config.apiUrl}/transcribe`, {
                    method: 'POST',
                    headers,
                    body: formData,
                });

                if (!resp.ok) throw new Error(`Transcription failed: ${resp.status}`);

                const data = await resp.json();
                if (data.text && data.text.trim()) {
                    inputEl.value = data.text.trim();
                    sendMessage();
                }
            } catch (err) {
                console.error('STT error:', err);
                // Fallback: put error in input
                addMessage('jose', 'Could not transcribe audio. Try typing instead.');
            }
        }

        // ── UI Helpers ────────────────────────────────────────────────────
        function addMessage(role, text, meta = null) {
            if (welcomeEl) welcomeEl.style.display = 'none';

            const div = document.createElement('div');
            div.className = `message ${role}`;

            let html = text.replace(/\n/g, '<br>');

            if (meta && role === 'jose') {
                const langClass = meta.language === 'es' ? 'es' : 'en';
                html += `
                    <div class="meta">
                        <span class="lang-badge ${langClass}">${meta.language}</span>
                        <span>${meta.register}</span>
                        <span>${meta.examples_used} ex</span>
                        <span>${meta.elapsed}s</span>
                    </div>`;
            }

            div.innerHTML = html;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // ── Health Check ──────────────────────────────────────────────────
        async function checkHealth() {
            const config = getConfig();
            try {
                const resp = await fetch(`${config.apiUrl}/health`);
                const data = await resp.json();
                if (data.status === 'ok') {
                    statusDot.classList.add('online');
                    statusText.textContent = `Online`;
                    // Now try WebSocket upgrade
                    connectWebSocket();
                } else {
                    statusText.textContent = 'Degraded';
                }
            } catch {
                statusText.textContent = 'Offline (REST)';
            }
        }

        // ── Init ──────────────────────────────────────────────────────────
        checkHealth();
        inputEl.focus();

        // Persist API key
        const savedKey = localStorage.getItem('twin_api_key');
        if (savedKey) document.getElementById('apiKey').value = savedKey;
        document.getElementById('apiKey').addEventListener('change', (e) => {
            localStorage.setItem('twin_api_key', e.target.value);
        });

        // Reconnect WS when settings change
        document.getElementById('apiUrl').addEventListener('change', () => {
            if (ws) ws.close();
            connectWebSocket();
        });

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
