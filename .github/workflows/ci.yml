name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    # Always runs: unit tests, fast, no API keys required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest \
            tests/test_observability.py \
            tests/test_personality_engine.py \
            tests/test_models.py \
            tests/test_parsers.py \
            tests/test_pii.py \
            -v --tb=short

  eval-identity:
    # Soft-gated quality check: runs the 46-question identity eval
    # against the remote Groq provider on every push to main. Free tier,
    # but needs GROQ_API_KEY as a repo secret. Set it at:
    #   Settings → Secrets and variables → Actions → New repository secret
    # See .github/CI_SECRETS.md for the full list.
    runs-on: ubuntu-latest
    needs: unit
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run identity eval (quick mode)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY secret not configured — skipping eval."
            echo "Add it at Settings → Secrets → Actions to enable."
            exit 0
          fi
          # --quick = 10 questions, ~30s on Groq free tier
          python -m tests.eval_identity --quick
