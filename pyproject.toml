[project]
name = "digital-twin"
version = "1.0.0"
description = "AI digital twin of Jose Peon — RAG + Groq 70B + ElevenLabs dual-voice clone + Whisper STT + WebSocket"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
